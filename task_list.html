<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مدیریت کارهای روزانه سجاد</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f4f9; padding: 20px; }
        .container { max-width: 600px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin: 0 auto; }
        h2 { text-align: center; color: #333; }
        .task-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #eee; align-items: center; }
        .completed { text-decoration: line-through; color: #aaa; }
        .btn { padding: 5px 10px; border-radius: 4px; text-decoration: none; font-size: 12px; color: white; margin-right: 5px; }
        .btn-add { background-color: #28a745; display: inline-block; margin-bottom: 20px; padding: 10px; }
        .btn-complete { background-color: #007bff; }
        .btn-delete { background-color: #dc3545; }
    </style>
</head>
<body>
<div class="container">
    <h2>📝 لیست کارهای روزانه من</h2>
    <a href="{% url 'create_task' %}" class="btn btn-add">➕ اضافه کردن کار جدید</a>
    {% for task in tasks %}
        <div class="task-item">
            <span class="{% if task.is_completed %}completed{% endif %}">
                <strong>{{ task.title }}</strong> - {{ task.description }}
            </span>
            <div>
                {% if not task.is_completed %}
                    <a href="{% url 'complete_task' task.id %}" class="btn btn-complete">✓ انجام شد</a>
                {% endif %}
                <a href="{% url 'delete_task' task.id %}" class="btn btn-delete">🗑 حذف</a>
            </div>
        </div>
    {% empty %}
        <p style="text-align: center; color: #666;">هیچ کاری برای امروز ثبت نشده است! 🎉</p>
    {% endfor %}
</div>
</body>
</html>
